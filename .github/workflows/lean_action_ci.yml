name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the `docs` job below needs more, and it
# requests it for itself.
permissions:
  contents: read

jobs:
  # The benchmark's tooling is pure stdlib Python, so this is seconds of work.
  # It runs on its own so a classification regression is reported as such
  # rather than buried in a 20-minute Lean build.
  manifest:
    name: Manifest and blueprint source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Manifest consistency
        run: python problems/manifest.py check

      - name: Classification regression tests
        run: python problems/test_classify.py

      - name: Blueprint sanitizer tests
        run: python problems/test_blueprint.py

      # content.tex is generated. If it does not match what the generator
      # produces from the current manifest, someone edited it by hand or forgot
      # to regenerate, and the published blueprint no longer describes the
      # benchmark it claims to describe.
      - name: Blueprint content is up to date
        run: |
          python problems/gen_blueprint.py
          git diff --exit-code --stat blueprint/src/content.tex \
            || { echo "::error::blueprint/src/content.tex is stale. Run: python problems/gen_blueprint.py"; exit 1; }

  build:
    name: Lean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Builds every default target, which includes the Problems library — so
      # a seed problem that stops elaborating against Mathlib fails CI.
      - uses: leanprover/lean-action@v1

  # Mathlib4-style API documentation, published to GitHub Pages.
  #
  # This is deliberately a separate job, gated on the default branch. A
  # repository has exactly one Pages site, so deploying it from every push on
  # every branch means each branch races to overwrite the others' docs — and it
  # made the whole Lean CI run red on feature branches for a reason that has
  # nothing to do with whether the Lean code builds.
  #
  # PREREQUISITE: Pages must be enabled for the repository with
  # Settings -> Pages -> Source = "GitHub Actions". Until it is, this job fails
  # with `Failed to create deployment (status: 404)` from actions/deploy-pages.
  # Nothing in this repository can enable it; it needs a repo admin.
  docs:
    name: API docs to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
