[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph plastexshowmore leanblueprint
; No TeX Live here, so plasTeX cannot call the real kpsewhich to find inputs.
; kpsewhich.bat is a local shim; see kpsewhich_shim.py. On a machine with a
; TeX installation you can delete this line and use the real one.
; The leading .\ is required: cmd.exe on this machine does not search the
; current directory for executables.
kpsewhich=.\kpsewhich.bat

[document]
toc-depth=3
toc-non-files=True

[files]
directory=../web/
; Split at \section, i.e. one page per domain. With 800+ theorem blocks a
; single-page build would be unusable.
split-level=1

[html5]
localtoc-level=2
extra-css=extra_styles.css
mathjax-dollars=False
